name: Build Windows Native Standalone

on:
  workflow_dispatch:
  push:
    paths:
      - "Standalone/WindowsNative/**"
      - ".github/workflows/build-windows-native.yml"

jobs:
  build:
    name: Build portable ZIP and installer
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build portable ZIP
        run: |
          .\Standalone\WindowsNative\scripts\build_portable.ps1

      - name: Install Inno Setup
        id: inno
        continue-on-error: true
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        id: installer
        continue-on-error: true
        run: |
          .\Standalone\WindowsNative\scripts\build_installer.ps1

      - name: Report installer failure
        if: steps.installer.outcome != 'success'
        run: |
          Write-Warning "Inno Setup installer build failed. The portable ZIP is still available as a workflow artifact."

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-gxTB-Runner-Windows-Portable
          path: Standalone/WindowsNative/dist/PyMOL-gxTB-Runner-Windows-Portable.zip
          if-no-files-found: error

      - name: Upload installer
        if: steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-gxTB-Runner-Windows-Setup
          path: Standalone/WindowsNative/dist/PyMOL-gxTB-Runner-Windows-Setup.exe
          if-no-files-found: error
